[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "osdd2pygeofilter"
dynamic = ["version"]
description = "OpenSearch Description Documents (OSDD) to typed pygeofilter generator"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Terradue", email = "info@terradue.com" },
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click>=8.5.0",
  "Jinja2==3.1.6",
  "loguru==0.7.3",
  "lxml==6.1.3",
  "pygeofilter==0.4.0",
  "session-adapters==0.7.0",
  "uritemplate>=4.2.0"
]

# ---------------------------------------------------------------------------
# Project Refs
# ---------------------------------------------------------------------------

[project.urls]
Documentation = "https://terradue.github.io/osdd2pygeofilter/"
Issues = "https://github.com/Terradue/osdd2pygeofilter/issues"
Source = "https://github.com/Terradue/osdd2pygeofilter"
Changelog = "https://github.com/Terradue/osdd2pygeofilter/blob/main/CHANGELOG.md"

[project.scripts]
osdd2pygeofilter = "osdd2pygeofilter.cli:main"

# ---------------------------------------------------------------------------
# Versioning and packaging
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "src/osdd2pygeofilter/__about__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/schemas",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osdd2pygeofilter"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source_pkgs = ["osdd2pygeofilter", "tests"]
branch = true
parallel = true
omit = [
  "src/osdd2pygeofilter/__about__.py",
]

[tool.coverage.paths]
osdd2pygeofilter = [
  "src/osdd2pygeofilter",
  "*/osdd2pygeofilter/src/osdd2pygeofilter"
]

[tool.coverage.report]
show_missing = true
skip_covered = false

exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Hatch: test environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=osdd2pygeofilter --cov-report=term-missing --cov-report=xml:coverage.xml {args:tests}"
test-show-setup = "pytest --setup-show {args:tests}"

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests_*.py"]

addopts = [
  "--strict-config",
  "--strict-markers",
]

xfail_strict = true

# ---------------------------------------------------------------------------
# Hatch: development and quality environment
# ---------------------------------------------------------------------------

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "mypy==2.4.1",
  "lxml-stubs>=0.5.1",
  "ruff==0.17.4",
  "bandit==1.9.4",
  "pytest==9.2.0",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Start with the essential rules
select = [
  # Core correctness
  "F",      # Pyflakes
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings

  # Imports and modernization
  "I",      # isort
  "UP",     # pyupgrade
  "FA",     # future annotations
  "TC",     # type-checking imports

  # Bugs and correctness
  "B",      # flake8-bugbear
  "RET",    # flake8-return
  "PTH",    # pathlib usage
  "C4",     # comprehensions

  # Simplification and readability
  "SIM",    # flake8-simplify

  # Complexity
  "C90",    # McCabe complexity

  # Pylint-derived checks
  "PLE",    # Pylint errors
  "PLW",    # Pylint warnings
  "PLR",    # Pylint refactor/design checks

  # Performance and Ruff-specific quality checks
  "PERF",
  "RUF",
]

ignore = [
  # Formatter-controlled rules
  "E501",   # line length
  "W191",   # tab indentation
  "E111",   # indentation
  "E114",   # indentation
  "E117",   # over-indented

  # Too opinionated for a general project template.
  # Enable per repository if useful.
  # "PLR0904", # too many public methods
]

[tool.ruff.lint.per-file-ignores]
# OpenAPI-generated signatures and HTTP status literals mirror the API schema.
"src/osdd2pygeofilter/**/*.py" = ["PLR0913", "PLR2004"]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 7

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves model annotations at runtime, including generated XML models.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pylint]
# Keep these deliberately stricter than Pylint defaults.
max-args = 6
max-branches = 10
max-returns = 6
max-statements = 40

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]

# Strict typing is the default for new Terradue Python projects.
strict = true

# Improve diagnostics.
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

# Avoid silently accepting untyped third-party APIs.
ignore_missing_imports = false

# Files checked by default.
files = [
  "src/osdd2pygeofilter",
  "tests"
]

# These upstream modules do not provide typing metadata in this installation.
# Keep the gateway strict while excluding these dependency implementations.
[[tool.mypy.overrides]]
module = ["session_adapters.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.hatch.envs.dev.scripts]
# ---------------------------------------------------------------------------
# Developer commands
#
# These commands are allowed to modify files.
# ---------------------------------------------------------------------------

format = "ruff format {args:src tests}"

fix = [
  "ruff check --fix {args:src tests}",
  "ruff format {args:src tests}",
]

# ---------------------------------------------------------------------------
# Verification commands
#
# These commands MUST NOT modify files and are suitable for CI.
# ---------------------------------------------------------------------------

format-check = "ruff format --check {args:src tests}"

lint = "ruff check {args:src tests}"
lint-check = "ruff check {args:src tests}"
design-check = "ruff check --select C90,PLR {args:src tests}"

typecheck = "mypy {args:src tests}"

security = "bandit -r {args:src}"

# Run the complete static quality gate.
quality = [
  "ruff format --check {args:src tests}",
  "ruff check {args:src tests}",
  "mypy {args:src tests}",
  "bandit -r {args:src}",
]

# Complete local/CI validation including tests.
check = [
  "ruff format --check {args:src tests}",
  "ruff check {args:src tests}",
  "mypy {args:src tests}",
  "bandit -r {args:src}",
  "pytest {args:tests}",
]

# Preserve editable-install test extras and uv's local wheel resolution.
[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0"
]
