site_name: OpenSearch to pygeofilter
site_description: Generate CQL2-to-OpenSearch evaluators from the command line
site_url: https://terradue.github.io/osdd2pygeofilter/
repo_url: https://github.com/Terradue/osdd2pygeofilter
repo_name: Terradue/osdd2pygeofilter
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Install: how-to/install.md
  - First evaluator: tutorials/first-steps.md
  - Use the CLI: how-to/use-cli.md
  - CLI reference: reference/cli.md
  - Supported queries: explanation/architecture.md
  - Advanced:
      - Python API: reference/api.md
      - Tutorials: tutorials/index.md
      - How-to guides: how-to/index.md
      - Reference: reference/index.md
      - Explanation: explanation/index.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
